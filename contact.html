   <div class="form-container">
       <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/merci.html">
           <input type="hidden" name="form-name" value="contact">
           <p hidden>
               <label>Ne pas remplir : <input name="bot-field"></label>
           </p>
           <div class="form-group">
               <label for="name">Prenom et Nom:</label>
               <input type="text" id="name" name="name" required>
           </div>
           <div class="form-group">
               <label for="email">Email:</label>
               <input type="email" id="email" name="email" required>
           </div>
           <div class="form-group">
               <label for="message">Message:</label>
               <textarea id="message" name="message" required></textarea>
           </div>
           <div class="form-group">
               <button type="submit">Envoyer le message</button>
           </div>
           <p class="form-note">Votre message sera envoyé à SeyeHub.</p>
       </form>
   </div>
